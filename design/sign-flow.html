<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUBLIC signing flow harness — test parent, published test keys, nothing real</title>
</head>
<body>
<p id="status">starting</p>
<iframe id="sandbox" src="../index.html" title="sandbox"></iframe>
<script type="module">
// Design/acceptance harness, not a release input. This page plays the Avibe
// parent app against the REAL sandbox runtime (index.html + src/main.ts) in the
// frame below: handshake, then one `sign` RPC. The frame verifies the request,
// shows its launcher card, and its Continue button opens the real authorization
// window, which receives the serialized prompt and renders the review.
//
// TEST TRANSPORT ONLY: the request is built here from the public acceptance
// corpus with PUBLISHED test keys (RFC 8032 seeds, secp256k1 scalar 1) and a
// synthetic daemon key and vault key. The vault in the frame stays locked, so
// the window's Confirm button would ask for a passkey that does not exist:
// nothing is unlocked, decrypted or signed here.
// ?case=<solana corpus id> | evm:<evm corpus id> | btc:<bitcoin core case id> | typed:<mail|permit|permit-max|permit2-batch-max|permit2-transfer>
//       | evmtx:<approve|approve-max|increase|eth-legacy> (synthetic transaction)
//       | transfers:sol,spl-checked,spl,raw,nonce (synthetic message)
// &locale=zh  &theme=light  &session=<label>
import corpus from '../src/fixtures/solana-acceptance/corpus.json';
import bitcoinCore from '../src/fixtures/vault-protected-bitcoin-core.json';
import { encodeFunctionData, hashTypedData, keccak256, parseAbi, serializeTransaction } from 'viem';
import { signFixture, solanaSignFixture, syntheticTransfersMessage } from '../src/signTestFixtures.ts';

const params = new URLSearchParams(location.search);
const id = params.get('case') ?? 'legacy-sol-transfer';
const appearance = { locale: params.get('locale') === 'zh' ? 'zh' : 'en', theme: params.get('theme') === 'light' ? 'light' : 'dark' };
const sessionLabel = params.get('session') ?? undefined;
const status = document.getElementById('status');
const frame = document.getElementById('sandbox');
Object.assign(frame.style, { position: 'fixed', inset: '0', width: '100%', height: '100%', border: '0' });
status.hidden = true;

const SYNTHETIC = { token: '0x1111111111111111111111111111111111111111', spender: '0x2222222222222222222222222222222222222222', owner: '0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf' };
const MAX160 = ((1n << 160n) - 1n).toString();
const MAX256 = ((1n << 256n) - 1n).toString();
const permitDetails = [{ name: 'token', type: 'address' }, { name: 'amount', type: 'uint160' }, { name: 'expiration', type: 'uint48' }, { name: 'nonce', type: 'uint48' }];
const permit2Domain = { name: 'Permit2', chainId: 1, verifyingContract: '0x000000000022D473030F116dDEE9F6B43aC78BA3' };
// Synthetic typed data with invented token and spender addresses; not a real token or protocol request.
const TYPED = {
  mail: { domain: { name: 'Ether Mail', version: '1', chainId: 1, verifyingContract: '0xCcCCccccCCCCcCCCCCCcCcCccCcCCCcCcccccccC' },
    types: { Person: [{ name: 'name', type: 'string' }, { name: 'wallet', type: 'address' }], Mail: [{ name: 'from', type: 'Person' }, { name: 'to', type: 'Person' }, { name: 'contents', type: 'string' }] },
    primaryType: 'Mail', message: { from: { name: 'Cow', wallet: '0xCD2a3d9F938E13CD947Ec05AbC7FE734Df8DD826' }, to: { name: 'Bob', wallet: '0xbBbBBBBbbBBBbbbBbbBbbbbBBbBbbbbBbBbbBBbB' }, contents: 'Hello, Bob!' } },
  permit: { domain: { name: 'Synthetic Token', version: '1', chainId: 1, verifyingContract: SYNTHETIC.token },
    types: { Permit: [{ name: 'owner', type: 'address' }, { name: 'spender', type: 'address' }, { name: 'value', type: 'uint256' }, { name: 'nonce', type: 'uint256' }, { name: 'deadline', type: 'uint256' }] },
    primaryType: 'Permit', message: { owner: SYNTHETIC.owner, spender: SYNTHETIC.spender, value: '25000000', nonce: 0, deadline: '1893456000' } },
  'permit2-batch-max': { domain: permit2Domain,
    types: { PermitBatch: [{ name: 'details', type: 'PermitDetails[]' }, { name: 'spender', type: 'address' }, { name: 'sigDeadline', type: 'uint256' }], PermitDetails: permitDetails },
    primaryType: 'PermitBatch', message: { details: [1, 2, 3, 4].map((n) => ({ token: `0x${String(n).repeat(40)}`, amount: n === 4 ? MAX160 : String(n * 1000000), expiration: 1893456000, nonce: n })), spender: SYNTHETIC.spender, sigDeadline: '1893456000' } },
  'permit2-transfer': { domain: permit2Domain,
    types: { PermitTransferFrom: [{ name: 'permitted', type: 'TokenPermissions' }, { name: 'spender', type: 'address' }, { name: 'nonce', type: 'uint256' }, { name: 'deadline', type: 'uint256' }], TokenPermissions: [{ name: 'token', type: 'address' }, { name: 'amount', type: 'uint256' }] },
    primaryType: 'PermitTransferFrom', message: { permitted: { token: SYNTHETIC.token, amount: '5000000' }, spender: SYNTHETIC.spender, nonce: 7, deadline: '1893456000' } },
};
TYPED['permit-max'] = { ...TYPED.permit, message: { ...TYPED.permit.message, value: MAX256 } };

// Synthetic transactions with invented addresses, ABI-encoded by viem; not a real token or protocol call.
const erc20 = parseAbi(['function approve(address spender,uint256 amount)', 'function increaseAllowance(address spender,uint256 addedValue)']);
const fee1559 = { maxFeePerGas: 30000000000n, maxPriorityFeePerGas: 1500000000n };
const EVM_TX = {
  approve: { type: 'eip1559', chainId: 1, nonce: 3, to: SYNTHETIC.token, value: 0n, gas: 60000n, ...fee1559, data: encodeFunctionData({ abi: erc20, functionName: 'approve', args: [SYNTHETIC.spender, 25000000n] }) },
  'approve-max': { type: 'eip1559', chainId: 1, nonce: 3, to: SYNTHETIC.token, value: 0n, gas: 60000n, ...fee1559, data: encodeFunctionData({ abi: erc20, functionName: 'approve', args: [SYNTHETIC.spender, BigInt(MAX256)] }) },
  increase: { type: 'eip1559', chainId: 1, nonce: 3, to: SYNTHETIC.token, value: 0n, gas: 60000n, ...fee1559, data: encodeFunctionData({ abi: erc20, functionName: 'increaseAllowance', args: [SYNTHETIC.spender, 5000000n] }) },
  'eth-legacy': { type: 'legacy', chainId: 1, nonce: 9, to: SYNTHETIC.spender, value: 500000000000000000n, gas: 21000n, gasPrice: 20000000000n, data: '0x' },
};

async function request() {
  if (id.startsWith('typed:')) {
    const typed = TYPED[id.slice(6)];
    const f = await signFixture('ecdsa-secp256k1-recoverable', Uint8Array.from({ length: 32 }, (_unused, index) => (index === 31 ? 1 : 0)));
    const context = { kind: 'eip-712-typed-data', typedData: typed, digestAlgorithm: 'eip712', digest: hashTypedData(typed).slice(2) };
    f.request.signingContext = context;
    Object.assign(f.request.context.release, { digest: context.digest, signingContext: structuredClone(context) });
    Object.assign(f.request.context.display, { command: 'vibe vault sign PUBLIC_TEST_KEY', egress: 'signature', ...(sessionLabel ? { sessionLabel } : {}) });
    f.resign();
    return f.request;
  }
  if (id.startsWith('btc:')) {
    // Public scalars from the Bitcoin Core acceptance fixture; the network label is the requester's (signet here).
    const vector = bitcoinCore.cases.find((candidate) => candidate.id === id.slice(4));
    const key = bitcoinCore.keys.find((candidate) => candidate.id === vector.signing_key_id);
    const f = await signFixture('schnorr-secp256k1-bip341-keypath', Uint8Array.from(key.public_secret_scalar_hex.match(/../g).map((byte) => Number.parseInt(byte, 16))));
    const context = {
      kind: 'bitcoin-taproot-keypath-v1', network: 'signet', unsignedTransaction: vector.unsigned_tx_hex,
      prevout: { amountSats: vector.funding.spent_output_value_sats, scriptPubKey: vector.funding.spent_output_script_hex },
      digestAlgorithm: 'bip341-sighash-default-keypath', digest: vector.expected.taproot_digest_hex,
    };
    f.request.signingContext = context;
    Object.assign(f.request.context.release, { scheme: 'schnorr-secp256k1-bip341-keypath', digest: context.digest, signingContext: structuredClone(context) });
    Object.assign(f.request.context.display, { command: 'vibe vault sign PUBLIC_TEST_KEY', egress: 'signature', source: { env: ['PUBLIC_TEST_KEY'] }, ...(sessionLabel ? { sessionLabel } : {}) });
    f.resign();
    return f.request;
  }
  if (id.startsWith('evmtx:')) {
    const tx = EVM_TX[id.slice(6)];
    const unsignedTransaction = Object.fromEntries(Object.entries(tx).map(([key, value]) => [key, typeof value === 'string' ? value : String(value)]));
    const context = { kind: 'evm-transaction', chainId: String(tx.chainId), unsignedTransaction, digestAlgorithm: 'keccak256', digest: keccak256(serializeTransaction(tx)).slice(2) };
    const f = await signFixture('ecdsa-secp256k1-recoverable', Uint8Array.from({ length: 32 }, (_unused, index) => (index === 31 ? 1 : 0)));
    f.request.signingContext = context;
    Object.assign(f.request.context.release, { digest: context.digest, signingContext: structuredClone(context) });
    f.request.context.display.command = 'vibe vault sign PUBLIC_TEST_KEY';
    if (sessionLabel) f.request.context.display.sessionLabel = sessionLabel;
    f.resign();
    return f.request;
  }
  if (id.startsWith('evm:')) {
    const vector = corpus.evm.find((candidate) => candidate.id === id.slice(4));
    const scalar = Uint8Array.from(vector.signature.publicScalarHex.match(/../g).map((byte) => Number.parseInt(byte, 16)));
    const f = await signFixture('ecdsa-secp256k1-recoverable', scalar);
    f.request.signingContext = structuredClone(vector.context);
    Object.assign(f.request.context.release, { digest: vector.context.digest, signingContext: structuredClone(vector.context) });
    f.request.context.display.command = 'vibe vault sign PUBLIC_TEST_KEY';
    if (sessionLabel) f.request.context.display.sessionLabel = sessionLabel;
    f.resign();
    return f.request;
  }
  if (id.startsWith('transfers:')) {
    // Synthetic accounts; signed (never here) by the published RFC 8032 test 1 key.
    const message = syntheticTransfersMessage(id.slice('transfers:'.length).split(','));
    return (await solanaSignFixture(message.messageHex, corpus.keys[0].seedHex, { sessionLabel })).request;
  }
  const vector = corpus.solana.find((candidate) => candidate.id === id);
  const seed = corpus.keys.find((key) => key.id === vector.requestedSigner.keyId).seedHex;
  return (await solanaSignFixture(vector.message.hex, seed, { sessionLabel })).request;
}

const pending = new Map();
const call = (op, payload) => new Promise((resolve) => {
  const requestId = crypto.randomUUID();
  pending.set(requestId, resolve);
  frame.contentWindow.postMessage({ channel: 'avibe.vault.crypto', version: 2, id: requestId, op, payload }, location.origin);
});
let started = false;
window.addEventListener('message', async (event) => {
  if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
  const message = event.data ?? {};
  if (pending.has(message.id)) { pending.get(message.id)(message); pending.delete(message.id); return; }
  if (message.type !== 'ready' || started) return;
  started = true;
  await call('handshake', { parentOrigin: location.origin, nonce: crypto.randomUUID(), appearance });
  const reply = await call('sign', await request());
  // Reached only when the flow ends (cancelled, or the passkey step failed).
  status.hidden = false;
  status.textContent = reply.ok ? 'UNEXPECTED: a signature was returned' : `ended without a signature: ${reply.error?.code}`;
  frame.remove();
});
</script>
</body>
</html>
