<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PUBLIC Bitcoin review design — no signing</title></head>
<body>
<script type="module">
// Inert design frame: real shell markup, tokens, parser/display and confirmation
// component. No main.ts runtime, encrypted material, passkey API or signer.
import shell from '../index.html?raw';
import '../src/style.css';
import fixture from '../src/fixtures/vault-protected-bitcoin-codec.json';
import policy from '../src/fixtures/vault-protected-bitcoin-policy.json';
import { setLocale } from '../src/i18n.ts';
import { verifyBitcoinSigningContext } from '../src/bitcoin.ts';
import { signingSchemeDescription } from '../src/signRequest.ts';
import { confirmOperationInActiveSlot, rawText } from '../src/operationUi.ts';
const params = new URLSearchParams(location.search);
setLocale(params.get('locale') === 'zh' ? 'zh' : 'en');
document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light';
document.body.classList.add('setup-mode');
const source = new DOMParser().parseFromString(shell, 'text/html');
document.body.append(source.getElementById('page'));
const vector = params.has('high-fee') ? policy.valid.find(v => v.id === 'percent-above-warning') : fixture.cases[0];
const publicKey = vector.publicKey ?? policy.publicKey;
const verified = verifyBitcoinSigningContext(vector.context, vector.context.digest, publicKey);
const scheme = 'schnorr-secp256k1-bip341-keypath';
const display = `${signingSchemeDescription(scheme, publicKey)}\nscheme: ${scheme}\n${verified.display}`;
void confirmOperationInActiveSlot({
  title: 'sign.title', subtitle: rawText('PUBLIC_TEST_KEY — design only'),
  body: rawText(display), confirmLabel: 'sign.confirm',
  details: { rows: [{ label: 'context.secrets', values: [rawText('PUBLIC_TEST_KEY')], variant: 'chips', tone: 'warning' }] },
}, new AbortController().signal).catch(() => {});
</script>
</body>
</html>
