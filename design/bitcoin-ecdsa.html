<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PUBLIC Bitcoin Legacy/Native review design — no signing</title></head>
<body>
<script type="module">
// Inert design frame: real shell markup, tokens, Legacy/Native verifier, the one
// shared review adapter and the confirmation component, on public vectors. No
// main.ts runtime, encrypted material, passkey API or signer; protected signing
// for these types is not yet admitted, so this is not an authorization window.
// ?type=legacy|native &account (HD wallet-account wording) &locale=zh &theme=light &open
import shell from '../index.html?raw';
import '../src/style.css';
import { setLocale, t } from '../src/i18n.ts';
import { verifyBitcoinEcdsaContext } from '../src/bitcoinEcdsa.ts';
import { bitcoinEcdsaSigningReview } from '../src/signingReviewFacts.ts';
import { confirmOperationInActiveSlot, rawText } from '../src/operationUi.ts';
import { legacyDesignContext, legacyVector, nativeDesignContext, nativeVector } from './bitcoinEcdsaFixtures.ts';
const params = new URLSearchParams(location.search);
const zh = params.get('locale') === 'zh';
setLocale(zh ? 'zh' : 'en');
document.documentElement.lang = zh ? 'zh' : 'en';
document.documentElement.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark';
document.body.classList.add('setup-mode');
const source = new DOMParser().parseFromString(shell, 'text/html');
document.body.append(source.getElementById('page'));
const legacy = params.get('type') === 'legacy';
const context = legacy ? legacyDesignContext() : nativeDesignContext();
const publicKey = legacy ? legacyVector.public_key : nativeVector.public_key;
const verified = verifyBitcoinEcdsaContext(context, context.digest, publicKey);
const boundary = params.has('account')
  ? { kind: 'account', index: 0, path: legacy ? "m/44'/0'/0'/0/0" : "m/84'/0'/0'/0/0" }
  : { kind: 'key' };
const review = bitcoinEcdsaSigningReview(verified.facts, { scheme: 'ecdsa-secp256k1-der', digest: verified.digest, publicKey, boundary });
void confirmOperationInActiveSlot({
  title: 'sign.title', subtitle: rawText('PUBLIC_TEST_KEY — design only'),
  review, reviewSession: 'Public test session', confirmLabel: 'sign.confirm',
  details: { rows: [
    { label: 'context.command', value: rawText('vibe vault sign PUBLIC_TEST_KEY'), variant: 'command' },
    { label: 'context.signReturns', value: rawText('signature') },
    { label: 'context.secrets', values: [rawText(`PUBLIC_TEST_KEY · ${t('context.kindKeypair')}`)], variant: 'chips', tone: 'warning' },
  ] },
}, new AbortController().signal).catch(() => {});
if (params.has('open')) document.querySelector('.review-details').open = true;
</script>
</body>
</html>
