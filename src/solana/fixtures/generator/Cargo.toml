[package]
name = "solana-parser-vectors"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
solana-message = { version = "=6.0.0", features = ["serde", "wincode"] }
solana-transaction = { version = "=6.0.0", features = ["serde"] }
solana-short-vec = { version = "=3.3.0", features = ["serde"] }
solana-pubkey-v3 = { package = "solana-pubkey", version = "3" }
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-instruction = "4"
solana-address = "2"
solana-hash = "4"
solana-sanitize = "3"
solana-signature = "3"
spl-token-interface = "=3.0.0"
bincode = "1.3.3"
serde_json = "1"
hex = "0.4"
